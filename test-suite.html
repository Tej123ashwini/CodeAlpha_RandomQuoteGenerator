<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated Test Suite - Random Quote Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .summary { margin-top: 20px; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Test Suite Results</h1>
  <div id="results"></div>

  <!-- Hidden container with the app elements for live DOM testing -->
  <div style="display: none;">
    <div id="quote-content" class="quote-content">
      <p id="quote-text" class="quote-text"></p>
      <cite id="quote-author" class="quote-author"></cite>
    </div>
    <button id="copy-btn"><span id="copy-icon"></span><span id="copy-btn-text">Copy Quote</span></button>
    <button id="new-quote-btn"><span id="new-quote-icon"></span></button>
  </div>

  <script src="script.js"></script>
  <script>
    const resultsDiv = document.getElementById("results");
    let passed = 0;
    let failed = 0;

    function assert(description, condition) {
      const p = document.createElement("p");
      if (condition) {
        p.className = "pass";
        p.textContent = "✔ PASS: " + description;
        passed++;
      } else {
        p.className = "fail";
        p.textContent = "✖ FAIL: " + description;
        failed++;
      }
      resultsDiv.appendChild(p);
      console.log((condition ? "[PASS] " : "[FAIL] ") + description);
    }

    async function runTests() {
      console.log("Starting automated tests...");

      // 1. Check quote collection size
      assert("Quote collection has at least 30 quotes", Array.isArray(quotes) && quotes.length >= 30);
      assert(`Actual quote count: ${quotes.length} (exceeds requirement)`, quotes.length >= 30);

      // 2. Validate format of every quote
      let allValid = true;
      for (let i = 0; i < quotes.length; i++) {
        const q = quotes[i];
        if (!q.text || typeof q.text !== "string" || q.text.trim().length === 0) allValid = false;
        if (!q.author || typeof q.author !== "string" || q.author.trim().length === 0) allValid = false;
      }
      assert("Every quote object has non-empty 'text' and 'author' strings", allValid);

      // 3. Test consecutive duplicate prevention over 100 consecutive calls
      let duplicateFound = false;
      let prevIndex = -1;
      for (let i = 0; i < 100; i++) {
        const nextIdx = getRandomQuoteIndex();
        if (nextIdx === prevIndex) {
          duplicateFound = true;
          break;
        }
        currentQuoteIndex = nextIdx;
        prevIndex = nextIdx;
      }
      assert("getRandomQuoteIndex() never selects the same quote consecutively over 100 iterations", !duplicateFound);

      // 4. Test initial quote display
      initializeQuote();
      assert("Initial quote text is populated", quoteText.textContent.length > 5);
      assert("Initial author text is populated", quoteAuthor.textContent.length > 2);
      
      const currentQ = quotes[currentQuoteIndex];
      assert("DOM author matches database author for current quote", quoteAuthor.textContent === currentQ.author);
      assert("DOM text matches database text for current quote", quoteText.textContent === `"${currentQ.text}"`);

      // 5. Test displayNewQuote() and DOM update
      const initialIdx = currentQuoteIndex;
      displayNewQuote();
      // Wait for the 200ms transition timeout to complete
      await new Promise(resolve => setTimeout(resolve, 400));
      assert("displayNewQuote() updates currentQuoteIndex to a different index", currentQuoteIndex !== initialIdx);
      const newQ = quotes[currentQuoteIndex];
      assert("DOM author is accurately updated after transition", quoteAuthor.textContent === newQ.author);
      assert("DOM text is accurately updated after transition", quoteText.textContent === `"${newQ.text}"`);

      // 6. Test Copy feedback functionality
      showCopiedFeedback();
      assert("Copy button receives 'copied' class", copyBtn.classList.contains("copied"));
      assert("Copy button text updates to 'Copied!'", copyBtnText.textContent === "Copied!");
      assert("Copy button icon updates to checkmark SVG", copyIcon.innerHTML.includes("polyline"));

      // 7. Test Copy feedback timeout reset
      await new Promise(resolve => setTimeout(resolve, 2100));
      assert("Copy button removes 'copied' class after timeout", !copyBtn.classList.contains("copied"));
      assert("Copy button text reverts to 'Copy Quote'", copyBtnText.textContent === "Copy Quote");

      // 8. Test Keyboard navigation event
      const prevKeyIndex = currentQuoteIndex;
      const keyEvent = new KeyboardEvent("keydown", { key: "n", code: "KeyN", bubbles: true });
      document.dispatchEvent(keyEvent);
      await new Promise(resolve => setTimeout(resolve, 300));
      assert("Pressing 'N' triggers new quote generation", currentQuoteIndex !== prevKeyIndex);

      const summary = document.createElement("div");
      summary.className = "summary";
      summary.innerHTML = `<h3>Testing Summary: ${passed} Passed, ${failed} Failed</h3>`;
      resultsDiv.appendChild(summary);

      document.title = `TESTS_FINISHED: ${passed} passed, ${failed} failed`;
      console.log(`TESTS_FINISHED: ${passed} passed, ${failed} failed`);
    }

    runTests();
  </script>
</body>
</html>
